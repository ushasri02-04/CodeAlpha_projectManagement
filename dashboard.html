<!DOCTYPE html>
<html>
<head>

<title>Dashboard</title>

<style>

body{
font-family:Arial;
background:#f4f5f7;
text-align:center;
}

.dashboard{
background:white;
width:450px;
margin:auto;
margin-top:50px;
padding:30px;
border-radius:10px;
box-shadow:0px 0px 10px gray;
}

.card{
background:#ebecf0;
padding:15px;
margin-top:15px;
border-radius:10px;
}

</style>

</head>

<body>

<div class="dashboard">

<h1>Dashboard 📊</h1>

<div class="card">
<h2>Total Projects</h2>
<p>5</p>
</div>

<div class="card">
<h2>Total Tasks</h2>
<p>20</p>
</div>

<div class="card">
<h2>Completed Tasks</h2>
<p>12</p>
</div>

<div class="card">
<h2>Pending Tasks</h2>
<p>8</p>
</div>

</div>

</body>
</html>
